# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
backend:
  name: github
  repo: svgmap/hyperlayering.org
  branch: main
  base_url: https://sveltia-cms-auth.hla-201.workers.dev
  auth: [oauth]

media_folder: /public/assets
public_folder: /assets

media_libraries:
  all: 
    slugify_filename: true
  default:
    config:
      transformations:
        raster_image:
          format: webp 
          quality: 100 
        svg:
          optimize: true

i18n:
  structure: multiple_folders
  locales: [en, ja]
  default_locale: en

collections:
  - name: updates
    label: Updates
    label_singular: Update
    folder: src/content/updates
    i18n: true
    fields:
      - name: title
        label: Title
        widget: string
        i18n: true
      - name: author
        label: Author
        widget: string
        i18n: duplicate
      - name: date
        label: Date
        widget: datetime
        type: date
        i18n: duplicate
      - name: description
        label: Description
        widget: string
        i18n: true
      - name: body 
        label: Body 
        widget: richtext 
        i18n: true
        buttons: 
          - bold
          - italic
          - strikethrough
          - code
          - link
          - heading-two
          - heading-three
          - heading-four
          - heading-five
          - heading-six
          - bulleted-list
          - numbered-list
          - quote
  - name: guidelines
    label: Guidelines
    label_singular: Update
    folder: src/content/guidelines
    i18n: true
    fields:
      - name: title
        label: Title
        widget: string
        i18n: true
      - name: lastUpdated
        label: Last Updated
        widget: datetime
        type: date
        i18n: duplicate
      - name: version
        label: Version
        widget: string
        i18n: duplicate
      - name: body 
        label: Body 
        widget: richtext 
        i18n: true
        buttons: 
          - bold
          - italic
          - strikethrough
          - code
          - link
          - heading-two
          - heading-three
          - heading-four
          - heading-five
          - heading-six
          - bulleted-list
          - numbered-list
          - quote